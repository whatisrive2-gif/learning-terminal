<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学习终端 · 工作台</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/blueprint.css"></head>
<body data-theme="blueprint" data-view="home">
<aside class="sidebar"><button class="brand" data-view="home" aria-label="返回开始首页"><span class="brand-mark">学</span><span>学习终端<small>LOCAL WORKSPACE</small></span></button><p class="nav-label">我的工作台</p><nav aria-label="主导航">
<button data-view="tasks"><span>☷</span>任务待办</button><button data-view="learning"><span>▤</span>近期学习</button><button data-view="tools"><span>⚙</span>工具部署</button><button data-view="dispatch"><span>⇄</span>Agent 交互中心</button></nav><section class="side-reminder" aria-label="事项提醒"><p class="nav-label">事项提醒</p><div id="side-reminder" aria-live="polite"></div></section>
<div class="side-bottom"><span class="status-dot"></span> 本地运行 · 数据留在本机<p>从这里安排，随时接着做。</p><button id="export" class="text-button">导出工作台记录 ↗</button><button id="shutdown" class="text-button">停止本地服务</button></div></aside>
<main><header><div class="breadcrumb">学习终端 <span>/</span> <span id="crumb">今日概览</span></div><div class="header-actions"><span id="connection" role="status">正在连接</span><button id="refresh" class="secondary">刷新</button><button id="new-task" class="primary">＋ 新建任务</button></div></header>
<section class="page-heading"><p class="eyebrow" id="eyebrow">YOUR LOCAL LEARNING HUB</p><h1 id="page-title">给今天一个清晰的起点。</h1><p id="page-description">安排要做的事，接着上次的学习，让工具各司其职。</p></section>
<div id="page"></div><footer>BLUEPRINT / THEME 01 <span>任务完成与知识掌握分别记录</span></footer></main>
<div id="toast" role="status" hidden></div>
<dialog id="editor"><form id="task-form"><div class="dialog-heading"><div><p class="eyebrow">TASK & PLAN</p><h2 id="editor-title">新建任务</h2></div><button type="button" class="close" data-close="editor" aria-label="关闭">×</button></div>
<label>要做什么<input name="title" required maxlength="200" placeholder="例如：继续概率论复习"></label>
<p class="hint" id="task-defaults"></p><details id="task-advanced"><summary>高级选项 · 可选</summary><div class="form-grid"><label>所属领域<input name="category" value="一般" maxlength="80" list="categories"></label><datalist id="categories"><option>学习</option><option>生活</option><option>项目</option></datalist><label>截止日期（可留空）<input type="date" name="due"></label><label>优先级<select name="priority"><option value="normal">普通</option><option value="high">优先处理</option><option value="low">稍后再做</option></select></label><label>交给谁处理<select name="executor"><option value="manual">人工处理</option><option value="agent-handoff">Agent · 人工交接</option><option value="local-inventory">本地工具 · 检查学习入口</option><option value="taber">Taber · 打开学习会话</option></select></label></div>
<label>Agent 名称（人工交接时填写）<input name="agent" placeholder="Codex / Qoder CN / 其他" maxlength="100"></label><label>关联学习会话<select name="session" id="session-options"></select></label><label>目标、上下文与验收要求<textarea name="notes" rows="4" maxlength="12000" placeholder="写下希望得到的结果，以及需要注意的事。"></textarea></label><label>前置任务（按住 Ctrl 可多选）<select name="dependencies" id="dependency-options" multiple size="3"></select></label><p class="hint">保存只记录任务。点击“派发”才会进入执行队列；Agent 交接不会自动调用模型。</p></details><p id="form-error" class="error" role="alert"></p><div class="dialog-footer"><button type="button" class="secondary" data-close="editor">取消</button><button class="primary" type="submit">保存任务</button></div></form></dialog>
<dialog id="detail"><div id="detail-content"></div></dialog>
<dialog id="response"><form id="response-form"><div class="dialog-heading"><h2 id="response-title">登记结果</h2><button type="button" class="close" data-close="response" aria-label="关闭">×</button></div><label id="response-label">结果与产物路径<textarea id="response-text" rows="9" required maxlength="50000"></textarea></label><p class="hint" id="response-hint"></p><p class="error" id="response-error" role="alert"></p><div class="dialog-footer"><button type="button" class="secondary" data-close="response">取消</button><button type="submit" class="primary">保存</button></div></form></dialog>
<dialog id="compose"><form id="compose-form"><div class="dialog-heading"><h2 id="compose-title"></h2><button type="button" data-close="compose" aria-label="关闭">×</button></div><div id="compose-fields"></div><p id="compose-error" class="error"></p><div class="dialog-footer"><button type="button" class="secondary" data-close="compose">取消</button><button type="submit" class="primary">保存</button></div></form></dialog><script src="/tool-ui.js"></script><script src="/app.js"></script><script src="/redesign.js"></script></body></html>
